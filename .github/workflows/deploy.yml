name: Deploy

on:
  push:
    branches: [prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy over rsync
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pinned host key(s); generate with `ssh-keyscan 123.206.216.124`
          # from a trusted network and store as a repository secret.
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" dist/ ubuntu@123.206.216.124:/home/ubuntu/www/vialite/

      - name: Notify via Server酱
        if: always()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="Vialite 部署成功"
            DESP="commit \`${GITHUB_SHA:0:7}\` 已成功部署到生产环境。"
          else
            TITLE="Vialite 部署失败"
            DESP="commit \`${GITHUB_SHA:0:7}\` 部署失败，请查看日志：${RUN_URL}"
          fi
          curl -fsS -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "desp=${DESP}"

      - name: Notify Discord
        # Skips silently when DISCORD_WEBHOOK_URL isn't configured, so forks/PRs
        # without the secret don't fail the workflow.
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping Discord notification."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ Vialite 部署成功 / Deploy succeeded"
            DESC="commit \`${GITHUB_SHA:0:7}\` 已部署到生产环境。"
            COLOR=3066993   # green
          else
            TITLE="❌ Vialite 部署失败 / Deploy failed"
            DESC="commit \`${GITHUB_SHA:0:7}\` 部署失败,请查看日志。"
            COLOR=15158332  # red
          fi
          curl -fsS -H "Content-Type: application/json" -X POST "$WEBHOOK" \
            --data @- <<JSON
          {
            "embeds": [{
              "title": "${TITLE}",
              "description": "${DESC}",
              "url": "${RUN_URL}",
              "color": ${COLOR}
            }]
          }
          JSON
